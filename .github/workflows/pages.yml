# Publica la carpeta app/ en GitHub Pages cada vez que se sube algo a main.
# En el repo: Settings -> Pages -> Source: "GitHub Actions".
# (Se publica sin Jekyll, así se sirven los archivos que empiezan con "_".)
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Dos jobs: si deploy-pages corre en el mismo job que la subida, a veces
# GitHub todavía no lista el artefacto («No artifacts named github-pages»).
jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app

  publicar:
    needs: subir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
